name: Import full Tally app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '!F')
    runs-on: macos-latest
    steps:
      - name: Checkout Playground repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout full Tally source
        uses: actions/checkout@v4
        with:
          repository: Zedikas/Tally
          path: _tally-source
          ref: main

      - name: Build the complete Swift Playground package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf Tally.swiftpm
          mkdir -p Tally.swiftpm/Sources/AppModule

          cp _tally-source/Tally/*.swift Tally.swiftpm/Sources/AppModule/

          if [ -d _tally-source/Tally/Resources ]; then
            cp -R _tally-source/Tally/Resources Tally.swiftpm/Sources/AppModule/Resources
          fi

          cat > Tally.swiftpm/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          import AppleProductTypes

          let package = Package(
              name: "Tally Playground",
              platforms: [.iOS("26.0")],
              products: [
                  .iOSApplication(
                      name: "Tally",
                      targets: ["AppModule"],
                      bundleIdentifier: "com.samua.tally.playground",
                      displayVersion: "2.0",
                      bundleVersion: "23",
                      appIcon: .placeholder(icon: .calculator),
                      accentColor: .presetColor(.pink),
                      supportedDeviceFamilies: [.pad, .phone],
                      supportedInterfaceOrientations: [
                          .portrait,
                          .landscapeRight,
                          .landscapeLeft,
                          .portraitUpsideDown(.when(deviceFamilies: [.pad]))
                      ]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "AppModule",
                      path: "Sources/AppModule",
                      resources: [
                          .process("Resources/Assets.xcassets"),
                          .copy("Resources/Localizable.xcstrings"),
                          .copy("Resources/Tally2BuildMetadata.json")
                      ]
                  )
              ],
              swiftLanguageVersions: [.version("6")]
          )
          EOF

          rm -f Tally.swiftpm/Sources/AppModule/Resources/Info.plist
          rm -f Tally.swiftpm/Sources/AppModule/Resources/LaunchScreen.storyboard

      - name: Verify migration before committing
        shell: bash
        run: |
          set -euo pipefail

          test -f Tally.swiftpm/Package.swift
          test -f Tally.swiftpm/Sources/AppModule/TallyApp.swift
          test -f Tally.swiftpm/Sources/AppModule/TallyStore.swift
          test -f Tally.swiftpm/Sources/AppModule/Models.swift
          test -d Tally.swiftpm/Sources/AppModule/Resources/Assets.xcassets
          test -f Tally.swiftpm/Sources/AppModule/Resources/Localizable.xcstrings

          grep -F '.process("Resources/Assets.xcassets")' Tally.swiftpm/Package.swift
          grep -F '.copy("Resources/Localizable.xcstrings")' Tally.swiftpm/Package.swift
          grep -F '.copy("Resources/Tally2BuildMetadata.json")' Tally.swiftpm/Package.swift
          if grep -F '.process("Resources")' Tally.swiftpm/Package.swift; then
            echo 'ERROR: Resources directory is still being processed as a whole.'
            exit 1
          fi

          source_count=$(find _tally-source/Tally -maxdepth 1 -name '*.swift' -type f | wc -l | tr -d ' ')
          package_count=$(find Tally.swiftpm/Sources/AppModule -maxdepth 1 -name '*.swift' -type f | wc -l | tr -d ' ')

          echo "Source Swift files: $source_count"
          echo "Playground Swift files: $package_count"

          if [ "$package_count" -ne "$source_count" ]; then
            echo "ERROR: Swift source count mismatch."
            exit 1
          fi

          while IFS= read -r source_file; do
            filename=$(basename "$source_file")
            test -f "Tally.swiftpm/Sources/AppModule/$filename" || {
              echo "ERROR: Missing migrated source file: $filename"
              exit 1
            }
          done < <(find _tally-source/Tally -maxdepth 1 -name '*.swift' -type f | sort)

          echo "Verified complete Tally source set: $package_count Swift files."

      - name: Build the Playground package on the macOS runner
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -packagePath Tally.swiftpm \
            -scheme Tally \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Persist the complete migration
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _tally-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git rebase origin/main

          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Port complete Tally app to Swift Playground"
            git push origin HEAD:main
          fi
