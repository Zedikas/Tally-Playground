name: Import full Tally app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '!F')
    runs-on: macos-latest
    steps:
      - name: Checkout Playground repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout full Tally source
        uses: actions/checkout@v4
        with:
          repository: Zedikas/Tally
          path: _tally-source
          ref: main

      - name: Build the complete Swift Playground package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf Tally.swiftpm
          mkdir -p Tally.swiftpm/Sources/AppModule
          cp _tally-source/Tally/*.swift Tally.swiftpm/Sources/AppModule/

          if [ -d _tally-source/Tally/Resources ]; then
            mkdir -p Tally.swiftpm/Sources/AppModule/Resources
            cp -R _tally-source/Tally/Resources/Assets.xcassets Tally.swiftpm/Sources/AppModule/Resources/
            cp _tally-source/Tally/Resources/Tally2BuildMetadata.json Tally.swiftpm/Sources/AppModule/Resources/
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          source = Path('_tally-source/Tally/Resources/Localizable.xcstrings')
          output = Path('Tally.swiftpm/Sources/AppModule/Resources/Localizable.strings')
          catalog = json.loads(source.read_text(encoding='utf-8'))
          lines = ['/* Generated from Localizable.xcstrings for Swift Playgrounds. */']
          for key in sorted(catalog.get('strings', {})):
              localizations = catalog['strings'][key].get('localizations', {})
              value = localizations.get('en', {}).get('stringUnit', {}).get('value', key)
              def quote(v):
                  return v.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n')
              lines.append(f'"{quote(key)}" = "{quote(value)}";')
          output.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          cat > Tally.swiftpm/Package.swift <<'EOF'
          // swift-tools-version: 6.0
          import PackageDescription
          import AppleProductTypes

          let package = Package(
              name: "Tally Playground",
              platforms: [.iOS("26.0")],
              products: [
                  .iOSApplication(
                      name: "Tally",
                      targets: ["AppModule"],
                      bundleIdentifier: "com.samua.tally.playground",
                      displayVersion: "2.0",
                      bundleVersion: "23",
                      appIcon: .asset("AppIcon"),
                      accentColor: .presetColor(.pink),
                      supportedDeviceFamilies: [.pad, .phone],
                      supportedInterfaceOrientations: [
                          .portrait,
                          .landscapeRight,
                          .landscapeLeft,
                          .portraitUpsideDown(.when(deviceFamilies: [.pad]))
                      ]
                  )
              ],
              targets: [
                  .executableTarget(
                      name: "AppModule",
                      path: "Sources/AppModule",
                      resources: [
                          .process("Resources/Assets.xcassets"),
                          .process("Resources/Localizable.strings"),
                          .copy("Resources/Tally2BuildMetadata.json")
                      ],
                      swiftSettings: [
                          .swiftLanguageMode(.v5)
                      ]
                  )
              ]
          )
          EOF

          rm -f Tally.swiftpm/Sources/AppModule/Resources/Info.plist
          rm -f Tally.swiftpm/Sources/AppModule/Resources/LaunchScreen.storyboard

      - name: Verify migration before committing
        shell: bash
        run: |
          set -euo pipefail
          test -f Tally.swiftpm/Package.swift
          test -f Tally.swiftpm/Sources/AppModule/TallyApp.swift
          test -f Tally.swiftpm/Sources/AppModule/TallyStore.swift
          test -f Tally.swiftpm/Sources/AppModule/Models.swift
          test -d Tally.swiftpm/Sources/AppModule/Resources/Assets.xcassets
          test -f Tally.swiftpm/Sources/AppModule/Resources/Localizable.strings
          test ! -e Tally.swiftpm/Sources/AppModule/Resources/Localizable.xcstrings
          grep -F 'appIcon: .asset("AppIcon")' Tally.swiftpm/Package.swift
          grep -F '.process("Resources/Assets.xcassets")' Tally.swiftpm/Package.swift
          grep -F '.process("Resources/Localizable.strings")' Tally.swiftpm/Package.swift
          grep -F '.copy("Resources/Tally2BuildMetadata.json")' Tally.swiftpm/Package.swift
          grep -F '.swiftLanguageMode(.v5)' Tally.swiftpm/Package.swift
          source_count=$(find _tally-source/Tally -maxdepth 1 -name '*.swift' -type f | wc -l | tr -d ' ')
          package_count=$(find Tally.swiftpm/Sources/AppModule -maxdepth 1 -name '*.swift' -type f | wc -l | tr -d ' ')
          echo "Source Swift files: $source_count"
          echo "Playground Swift files: $package_count"
          test "$package_count" -eq "$source_count"
          echo "Verified complete Tally source set."

      - name: Persist the complete migration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _tally-source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Commit the generated package first so generated changes are not
          # present as unstaged files when the branch is synchronized.
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Port complete Tally app to Swift Playground"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
